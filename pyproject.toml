[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "guilda"
description = "Engineering template with core, profiles, adapters and integrations for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]

[project.scripts]
guilda = "guilda.cli:main"

[tool.hatch.version]
path = "guilda/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["guilda"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "LICENSE"
