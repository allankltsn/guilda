[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guilda"
description = "Engineering template with core, profiles, adapters and integrations for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]

[project.scripts]
guilda = "guilda.cli:main"

[tool.hatch.version]
path = "guilda/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["guilda"]

# Task 3 replaces these static directory entries with a build hook driven by guilda/payload.txt.
[tool.hatch.build.targets.wheel.force-include]
"core" = "guilda/_data/core"
"profiles" = "guilda/_data/profiles"
"adapters" = "guilda/_data/adapters"
"integrations" = "guilda/_data/integrations"
"template.json" = "guilda/_data/template.json"
"LICENSE" = "LICENSE"
