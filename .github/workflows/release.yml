name: Release

# O nome deste arquivo (release.yml), o ambiente `pypi`, o dono e o repositório
# estão registrados como publicador confiável no PyPI. Não renomear.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag confere com as versões
        run: python scripts/check_release.py
      - name: Commit da tag já está na main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "O commit $GITHUB_SHA ainda não está na main."
            echo "Faça o merge na main e rode este fluxo de novo (Re-run jobs)."
            exit 1
          fi
      - name: Testes
        run: python -m unittest discover -s tests

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instala build
        run: python -m pip install build
      - name: Gera sdist e wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Aprovação manual do mantenedor: configurada no ambiente `pypi` do GitHub.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
