name: Release

# O nome deste arquivo (release.yml), o ambiente `pypi`, o dono e o repositório
# estão registrados como publicador confiável no PyPI. Não renomear.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tag confere com as versões
        run: python scripts/check_release.py
      - name: Commit da tag já está na main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "O commit $GITHUB_SHA ainda não está na main."
            echo "Faça o merge na main e rode este fluxo de novo (Re-run jobs)."
            exit 1
          fi
      - name: Payload sincronizado
        run: python -m guilda.payload --check
      - name: Testes
        run: python -m unittest discover -s tests

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instala build
        run: python -m pip install build
      - name: Gera sdist e wheel
        run: python -m build
      - name: Confere o wheel (falha se o módulo build faltar)
        run: |
          python -c "import build"
          python -m unittest tests.test_guilda_wheel
      - name: Inspeciona os arquivos de dist/
        run: python scripts/check_dist.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Aprovação manual do mantenedor: configurada no ambiente `pypi` do GitHub.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
